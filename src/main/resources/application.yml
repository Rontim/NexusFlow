server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: NexusFlow
  datasource:
    url: jdbc:postgresql://localhost:5433/nexusflow_db
    username: nexusflow
    password: ${DB_PASSWORD:nexus_flow}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
